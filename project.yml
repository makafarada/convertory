name: Convertory
options:
  bundleIdPrefix: com.convertory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: CH4N7A9L79
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Convertory:
    type: application
    platform: iOS
    sources:
      - path: ConvertoryApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.convertory.ios
        PRODUCT_NAME: Convertory
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ConvertoryApp/Info.plist
      properties:
        CFBundleDisplayName: Convertory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Convertory uses the camera only when you open the document scanner, to photograph pages you want to turn into a PDF. Pictures stay on this iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Picture
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
  ConvertoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConvertoryTests
    dependencies:
      - target: Convertory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.convertory.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Convertory.app/Convertory
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Convertory:
    build:
      targets:
        Convertory: all
        ConvertoryTests: [test]
    test:
      targets:
        - ConvertoryTests
    run:
      config: Debug
    archive:
      config: Release
