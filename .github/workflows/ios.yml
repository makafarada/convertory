name: iOS build (TestFlight)

# Native Swift/SwiftUI app (ConvertoryApp/). The Xcode project is generated from
# project.yml with XcodeGen on the runner, unit tests run on an iPhone simulator,
# then the app is archived, signed through the App Store Connect API key and
# uploaded to TestFlight. No Mac needed.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID     App Store Connect API key's Key ID
#   ASC_ISSUER_ID  Issuer ID from the same page
#   ASC_KEY_P8     Full contents of the downloaded AuthKey_XXXX.p8 file (including BEGIN/END lines)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight after building"
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          set -e
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          set -e
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project Convertory.xcodeproj

      - name: Unit tests (iPhone simulator)
        run: |
          set -eo pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Convertory.xcodeproj \
            -scheme Convertory \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: ${{ runner.temp }}/tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID secret is not set"; exit 1; }
          test -n "$ASC_KEY_P8" || { echo "ASC_KEY_P8 secret is not set"; exit 1; }
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild archive \
            -project Convertory.xcodeproj \
            -scheme Convertory \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Convertory.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=CH4N7A9L79 \
            CURRENT_PROJECT_VERSION=$((${{ github.run_number }} + 100))

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Convertory.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Save IPA as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertory-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -rf "$HOME/private_keys"

